# Example: put this in your *website* repo. Uses the deploy_role_arn output per environment.
name: deploy-site
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev # GitHub environment name must equal the infra environment (dev|staging|prod)
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build # -> ./dist
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.SITE_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
      - run: |
          aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "*.html" --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --delete --exclude "*" --include "*.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths "/*"
